name: Worldlines Cycle

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Worldlines cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent/run.py

      # Commits all cycle outputs including:
      #   cycles/YYYY-MM-DD.md    — interpretive cycle output
      #   state/model.md          — updated living model
      #   tensions/open.md        — updated tensions
      #   scoring/scores.jsonl    — appended paper scores
      #   scoring/distribution.png — regenerated scatter plot
      #   scoring/visualize.html  — static visualization (committed once, rarely changes)
      - name: Commit outputs
        run: |
          git config user.name "worldlines-agent"
          git config user.email "worldlines@autonomous"
          git add -A
          git diff --staged --quiet || git commit -m "cycle: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
